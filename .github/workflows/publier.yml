# Publie automatiquement une mise a jour a chaque changement du code.
# Construit l'app sur un PC Windows de GitHub et publie le Setup dans les Releases
# de ce depot : les apps installees se mettent a jour toutes seules.
name: Publier la mise a jour

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: En attente du logo
        if: hashFiles('src/logo.png') == ''
        run: echo "Pas encore de src/logo.png - ajoute ton logo dans le dossier src pour publier."

      - uses: actions/setup-node@v4
        if: hashFiles('src/logo.png') != ''
        with:
          node-version: 20

      - name: Installer
        if: hashFiles('src/logo.png') != ''
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp@0.33.5

      - name: Pseudo GitHub dans package.json
        if: hashFiles('src/logo.png') != ''
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw
          $p.Replace('TON-PSEUDO-GITHUB', '${{ github.repository_owner }}') | Set-Content package.json -NoNewline -Encoding utf8

      - name: Preparer le logo et l'icone
        if: hashFiles('src/logo.png') != ''
        run: node prepare-logo.js

      - name: Construire et publier
        if: hashFiles('src/logo.png') != ''
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
